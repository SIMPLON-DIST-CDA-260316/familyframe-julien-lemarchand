packages:
  - client
  - server

# pnpm 10 blocks dependency install scripts by default; allow the ones we need.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp

# Ships prebuilt binaries (Windows, Linux glibc/musl, x64/arm64) loaded at runtime:
# its node-gyp build script would only matter on a platform without one.
ignoredBuiltDependencies:
  - argon2
